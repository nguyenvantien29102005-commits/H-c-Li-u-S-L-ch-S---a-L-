<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sơ đồ khám phá 3D - Địa đạo Củ Chi</title>

<style>
:root{
    --background:#d8ded6;
    --panel:rgba(246,239,227,.96);
    --panel-item:#e7dccb;
    --text:#24384a;
    --muted:#6f7d85;
    --primary:#2d4355;
    --primary-dark:#203542;
    --shadow:0 18px 45px rgba(30,40,46,.17);
    --border:rgba(36,56,74,.09);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:
        "Be Vietnam Pro",
        "Segoe UI",
        Arial,
        sans-serif;

    color:var(--text);
    background:var(--background);
    overflow:hidden;
}

.navbar{
    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 24px;

    background:#f5f6f1;

    border-bottom:
        1px solid var(--border);

    position:relative;

    z-index:100;
}

.logo{
    color:var(--text);

    text-decoration:none;

    font-size:18px;
    font-weight:900;

    letter-spacing:.04em;
}

.menu{
    display:flex;
    gap:28px;
    align-items:center;
}

.menu a{
    color:var(--text);

    text-decoration:none;

    font-size:14px;
    font-weight:800;
}

.menu a:hover{
    color:#6d3d27;
}

.viewer{
    position:relative;

    width:100%;
    height:
        calc(100vh - 68px);

    min-height:650px;

    overflow:hidden;

    background:var(--background);
}

#scene3d{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:1;
}

.focus-panel{
    position:absolute;

    top:18px;
    right:18px;

    z-index:15;

    width:260px;

    max-height:
        calc(100% - 36px);

    overflow-y:auto;

    padding:14px;

    background:var(--panel);

    border:
        1px solid var(--border);

    border-radius:22px;

    box-shadow:var(--shadow);

    backdrop-filter:
        blur(12px);
}

.focus-panel h3{
    font-size:15px;

    margin:
        2px 4px
        11px;
}

.focus-panel p{
    margin:
        0 4px
        12px;

    color:var(--muted);

    font-size:11px;

    line-height:1.55;
}

.focus-btn{
    width:100%;

    min-height:43px;

    margin-bottom:8px;

    padding:
        9px 12px;

    border:none;

    border-radius:13px;

    background:
        var(--panel-item);

    color:var(--text);

    cursor:pointer;

    text-align:left;

    font-size:13px;
    font-weight:800;

    transition:
        transform .2s ease,
        background .2s ease;
}

.focus-btn:hover{
    background:#dccdb7;

    transform:
        translateX(-3px);
}

.focus-btn.primary{
    background:
        var(--primary);

    color:white;
}

.focus-btn.primary:hover{
    background:
        var(--primary-dark);
}

.help-panel{
    position:absolute;

    left:18px;
    bottom:18px;

    z-index:15;

    width:215px;

    padding:
        13px 15px;

    border-radius:17px;

    background:
        rgba(249,246,239,.94);

    border:
        1px solid var(--border);

    box-shadow:
        var(--shadow);

    color:var(--muted);

    font-size:12px;

    line-height:1.65;
}

.help-panel strong{
    color:var(--text);
}

.hover-name{
    position:absolute;

    display:none;

    z-index:30;

    pointer-events:none;

    padding:
        7px 10px;

    border-radius:9px;

    background:
        rgba(25,34,40,.94);

    color:white;

    font-size:12px;
    font-weight:800;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.2);
}

.overlay{
    position:absolute;

    inset:0;

    z-index:40;

    display:none;

    background:
        rgba(15,23,28,.42);
}

.overlay.show{
    display:block;
}

.info-panel{
    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    z-index:50;

    display:none;

    width:
        min(
            600px,
            calc(100% - 30px)
        );

    max-height:86vh;

    overflow-y:auto;

    padding:28px;

    border-radius:24px;

    background:#fff;

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.30);
}

.info-panel.show{
    display:block;
}

.close-info{
    position:absolute;

    top:14px;
    right:14px;

    width:42px;
    height:42px;

    border:none;

    border-radius:50%;

    background:#edf0f0;

    cursor:pointer;

    color:var(--text);

    font-size:24px;
}

.info-icon{
    margin-bottom:5px;

    font-size:42px;
}

.info-chip{
    display:inline-block;

    margin-bottom:10px;

    padding:
        5px 10px;

    border-radius:999px;

    background:#e4ebdf;

    color:#4d6848;

    font-size:10px;
    font-weight:900;

    letter-spacing:.9px;
}

.info-panel h2{
    margin-bottom:13px;

    padding-right:40px;

    font-size:28px;
}

.info-panel p{
    margin-bottom:15px;

    color:#53616a;

    line-height:1.75;
}

.info-panel h4{
    margin:
        15px 0
        8px;

    color:#6d3d27;

    font-size:14px;
}

.info-panel ul{
    padding-left:20px;

    color:#53616a;

    line-height:1.8;
}

.info-note{
    margin-top:17px;

    padding:
        14px 16px;

    border-left:
        4px solid
        #b38b5b;

    border-radius:13px;

    background:#f4efe7;

    color:#56636b;

    line-height:1.65;
}

@media(max-width:850px){

    .menu{
        display:none;
    }

    .focus-panel{
        width:200px;

        right:10px;
        top:10px;

        max-height:
            calc(100% - 20px);

        padding:11px;
    }

    .focus-panel p{
        display:none;
    }

    .focus-btn{
        min-height:38px;

        padding:
            7px 9px;

        font-size:11px;
    }

    .help-panel{
        left:10px;
        bottom:10px;

        width:145px;

        font-size:11px;
    }
}
</style>
</head>


<body>


<header class="navbar">

    <a
        href="index.html"
        class="logo">

        ĐỊA ĐẠO CỦ CHI

    </a>


    <nav class="menu">

        <a href="index.html">
            Trang chủ
        </a>

        <a href="thong-tin.html">
            Thông tin
        </a>

        <a href="so-do.html">
            Sơ đồ 3D
        </a>

        <a href="thu-thach.html">
            Thử thách
        </a>

    </nav>

</header>



<main class="viewer">


<div id="scene3d"></div>



<aside class="focus-panel">

    <h3>
        Khám phá cận cảnh
    </h3>

    <p>
        Chọn một không gian
        để camera tiến gần và
        quan sát bên trong.
    </p>

    <button
        class="focus-btn primary"
        onclick="goOverview()">

        ◉ Toàn cảnh địa đạo

    </button>

    <button
        class="focus-btn"
        onclick="focusRoom('entrance')">

        🚪 Cửa ra vào

    </button>

    <button
        class="focus-btn"
        onclick="focusRoom('kitchen')">

        🔥 Bếp Hoàng Cầm

    </button>

    <button
        class="focus-btn"
        onclick="focusRoom('command')">

        🗺️ Hầm chỉ huy

    </button>

    <button
        class="focus-btn"
        onclick="focusRoom('living')">

        🛏️ Hầm sinh hoạt

    </button>

    <button
        class="focus-btn"
        onclick="focusRoom('medical')">

        ✚ Hầm quân y

    </button>

    <button
        class="focus-btn"
        onclick="focusRoom('storage')">

        📦 Kho dự trữ

    </button>

    <button
        class="focus-btn"
        onclick="focusRoom('meeting')">

        👥 Hầm hội họp

    </button>

    <button
        class="focus-btn"
        onclick="focusRoom('aframe')">

    </button>

    <button
        class="focus-btn"
        onclick="focusRoom('combat')">

    </button>

    <button
        class="focus-btn"
        onclick="focusRoom('well')">

        💧 Giếng nước

    </button>

</aside>



<div class="help-panel">

    <strong>
        Điều khiển mô hình
    </strong>

    <br>

    🖱 Kéo chuột: xoay

    <br>

    🔍 Cuộn: phóng to / thu nhỏ

    <br>

    🔴 Chấm đỏ: xem chi tiết

</div>



<div
    id="hoverName"
    class="hover-name">
</div>



<div
    id="overlay"
    class="overlay"
    onclick="closeInfo()">
</div>



<section
    id="infoPanel"
    class="info-panel">

    <button
        class="close-info"
        onclick="closeInfo()">

        ×

    </button>

    <div
        id="infoIcon"
        class="info-icon">
    </div>

    <div class="info-chip">

        KHÔNG GIAN ĐỊA ĐẠO

    </div>

    <h2 id="infoTitle"></h2>

    <p id="infoDescription"></p>

    <h4>
        Chi tiết quan sát
    </h4>

    <ul id="infoDetails"></ul>

    <div
        id="infoNote"
        class="info-note">
    </div>

</section>


</main>



<script
src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js">
</script>


<script
src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js">
</script>



<script>

/* =========================================================
   01. KHỞI TẠO
========================================================= */

const container =
    document.getElementById(
        "scene3d"
    );


if(
    typeof THREE ===
    "undefined"
){

    container.innerHTML = `

        <div style="
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:30px;
            background:#d8ded6;
            color:#24384a;
            font-family:Arial,sans-serif;
        ">

            Không tải được mô hình 3D.
            <br><br>
            Hãy kiểm tra kết nối Internet
            và tải lại trang.

        </div>

    `;

    throw new Error(
        "Three.js chưa tải."
    );

}



/* =========================================================
   02. SCENE
========================================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0xd8ded6
    );


scene.fog =
    new THREE.Fog(
        0xd8ded6,
        65,
        135
    );



/* =========================================================
   03. CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(

        46,

        container.clientWidth /
        container.clientHeight,

        .1,

        1000

    );


camera.position.set(
    37,
    23,
    39
);



/* =========================================================
   04. RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        alpha:false,

        powerPreference:
            "high-performance"

    });


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        2
    )

);


renderer.setSize(

    container.clientWidth,

    container.clientHeight

);


renderer.setClearColor(
    0xd8ded6,
    1
);


renderer.shadowMap.enabled =
    true;


renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


renderer.outputEncoding =
    THREE.sRGBEncoding;


container.appendChild(
    renderer.domElement
);



/* =========================================================
   05. CONTROLS
========================================================= */

const controls =
    new THREE.OrbitControls(

        camera,

        renderer.domElement

    );


controls.enableDamping =
    true;


controls.dampingFactor =
    .055;


controls.minDistance =
    8;


controls.maxDistance =
    90;


controls.maxPolarAngle =
    Math.PI * .91;


controls.target.set(
    0,
    -5,
    0
);



/* =========================================================
   06. ÁNH SÁNG CHUNG
========================================================= */

scene.add(

    new THREE.AmbientLight(

        0x7f5a42,

        .34

    )

);


scene.add(

    new THREE.HemisphereLight(

        0xf6e4c8,

        0x2e170f,

        .82

    )

);


const sunlight =
    new THREE.DirectionalLight(

        0xffd6a3,

        .72

    );


sunlight.position.set(
    26,
    34,
    18
);


sunlight.castShadow =
    true;


sunlight.shadow.mapSize.width =
    2048;


sunlight.shadow.mapSize.height =
    2048;


scene.add(
    sunlight
);


const fillLight =
    new THREE.DirectionalLight(

        0xffb56a,

        .18

    );


fillLight.position.set(

    -16,
    10,
    -18

);


scene.add(
    fillLight
);



/* =========================================================
   07. VẬT LIỆU
========================================================= */

function material(
    color,
    roughness=.9
){

    return new THREE.MeshStandardMaterial({

        color:color,

        roughness:roughness

    });

}


/* xanh đậm bề mặt */

const grassMat =
    material(
        0x4b5f2d,
        1
    );


/* nâu đất mặt cắt */

const soilMat =
    material(
        0x5a2d1d,
        .99
    );


/* đất sâu */

const darkSoilMat =
    material(
        0x2d160f,
        1
    );


/* đường địa đạo */

const tunnelMat =
    material(
        0x6d3d27,
        .98
    );


const woodMat =
    material(
        0x65442e,
        .95
    );


const darkWoodMat =
    material(
        0x392218,
        .98
    );


const clothMat =
    material(
        0x6f5b49,
        .98
    );


const metalMat =
    new THREE.MeshStandardMaterial({

        color:
            0x666b6d,

        roughness:
            .58,

        metalness:
            .2

    });



/* =========================================================
   08. HÌNH HỌC
========================================================= */

function box(
    width,
    height,
    depth,
    mat
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            mat

        );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    return mesh;

}



function cylinder(
    radiusTop,
    radiusBottom,
    height,
    mat,
    segments=14
){

    const mesh =
        new THREE.Mesh(

            new THREE.CylinderGeometry(

                radiusTop,
                radiusBottom,
                height,
                segments

            ),

            mat

        );


    mesh.castShadow =
        true;


    mesh.receiveShadow =
        true;


    return mesh;

}



/* =========================================================
   09. ĐÈN DẦU
========================================================= */

function addLantern(
    group,
    x,
    y,
    z
){

    const body =
        cylinder(

            .09,
            .11,
            .3,
            metalMat,
            10

        );


    body.position.set(
        x,
        y,
        z
    );


    group.add(
        body
    );


    const flame =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .085,
                12,
                12
            ),

            new THREE.MeshStandardMaterial({

                color:
                    0xffe0a6,

                emissive:
                    0xff9a2f,

                emissiveIntensity:
                    1.7

            })

        );


    flame.position.set(
        x,
        y-.02,
        z
    );


    group.add(
        flame
    );


    const halo =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .16,
                12,
                12
            ),

            new THREE.MeshBasicMaterial({

                color:
                    0xffc97c,

                transparent:
                    true,

                opacity:
                    .18

            })

        );


    halo.position.set(
        x,
        y-.02,
        z
    );


    group.add(
        halo
    );


    const light =
        new THREE.PointLight(

            0xffb24a,

            1.95,

            12,

            1.8

        );


    light.position.set(
        x,
        y,
        z
    );


    group.add(
        light
    );

}



/* =========================================================
   10. ĐÈN DỌC ĐƯỜNG HẦM
========================================================= */

function addTunnelLamp(
    x,
    y,
    z
){

    const lamp =
        cylinder(
            .06,
            .06,
            .18,
            metalMat,
            10
        );


    lamp.position.set(
        x,
        y,
        z
    );


    scene.add(
        lamp
    );


    const glow =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .07,
                10,
                10
            ),

            new THREE.MeshStandardMaterial({

                color:
                    0xffdeaa,

                emissive:
                    0xffa03a,

                emissiveIntensity:
                    1.45

            })

        );


    glow.position.set(
        x,
        y-.03,
        z
    );


    scene.add(
        glow
    );


    const light =
        new THREE.PointLight(

            0xffb04c,

            1.4,

            8,

            1.9

        );


    light.position.set(
        x,
        y,
        z
    );


    scene.add(
        light
    );

}



/* =========================================================
   11. NHÂN VẬT
========================================================= */

function addPerson(
    group,
    x,
    y,
    z,
    scale=1,
    pose="stand",
    shirtColor=0x55684a
){

    const person =
        new THREE.Group();


    const skin =
        material(
            0xc29570,
            .96
        );


    const shirt =
        material(
            shirtColor,
            .96
        );


    const pants =
        material(
            0x3b4336,
            .97
        );


    const hatMat =
        material(
            0x515e40,
            .98
        );


    const body =
        cylinder(

            .16*scale,
            .20*scale,
            .48*scale,
            shirt,
            10

        );


    body.position.y =
        .55*scale;


    person.add(
        body
    );


    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .145*scale,
                12,
                12
            ),

            skin

        );


    head.position.y =
        .92*scale;


    head.castShadow =
        true;


    person.add(
        head
    );


    const hat =
        cylinder(

            .17*scale,
            .2*scale,
            .065*scale,
            hatMat,
            12

        );


    hat.position.y =
        1.045*scale;


    person.add(
        hat
    );


    const leg1 =
        cylinder(

            .05*scale,
            .06*scale,
            .42*scale,
            pants,
            8

        );


    leg1.position.set(
        -.085*scale,
        .13*scale,
        0
    );


    person.add(
        leg1
    );


    const leg2 =
        leg1.clone();


    leg2.position.x =
        .085*scale;


    person.add(
        leg2
    );


    const arm1 =
        cylinder(

            .04*scale,
            .045*scale,
            .37*scale,
            skin,
            8

        );


    arm1.position.set(
        -.22*scale,
        .56*scale,
        0
    );


    arm1.rotation.z =
        -.30;


    person.add(
        arm1
    );


    const arm2 =
        arm1.clone();


    arm2.position.x =
        .22*scale;


    arm2.rotation.z =
        .30;


    person.add(
        arm2
    );


    if(
        pose ===
        "sit"
    ){

        body.position.y =
            .43*scale;


        head.position.y =
            .79*scale;


        hat.position.y =
            .91*scale;


        leg1.rotation.x =
            Math.PI/2;


        leg1.position.set(
            -.09*scale,
            .06*scale,
            .17*scale
        );


        leg2.rotation.x =
            Math.PI/2;


        leg2.position.set(
            .09*scale,
            .06*scale,
            .17*scale
        );

    }


    if(
        pose ===
        "crouch"
    ){

        person.rotation.x =
            -.18;


        body.position.y =
            .40*scale;


        head.position.y =
            .72*scale;


        hat.position.y =
            .84*scale;


        leg1.rotation.z =
            .55;


        leg2.rotation.z =
            -.55;

    }


    if(
        pose ===
        "sleep"
    ){

        person.rotation.z =
            Math.PI/2;


        person.scale
            .setScalar(
                .85
            );

    }


    person.position.set(
        x,
        y,
        z
    );


    group.add(
        person
    );


    return person;

}



/* =========================================================
   12. NỘI THẤT
========================================================= */

function addTable(
    group,
    x,
    y,
    z,
    w=2,
    d=1,
    h=.8
){

    const top =
        box(
            w,
            .12,
            d,
            woodMat
        );


    top.position.set(
        x,
        y,
        z
    );


    group.add(
        top
    );


    [
        [-1,-1],
        [1,-1],
        [-1,1],
        [1,1]

    ].forEach(

        p => {

            const leg =
                box(
                    .09,
                    h,
                    .09,
                    darkWoodMat
                );

    x,
    z,
    scale=1
){

            .1*scale,

            2.7*scale,

            material(
                0x573824,
                1
            ),

            8

        let i=0;
        i<7;

    ){

        const leaf =
            box(

                .08*scale,
                .04*scale,
                1.4*scale,

                material(
                    0x1f4723,

                )

            );


        const angle =
            i*

            4.15*scale;

            .35*

        leaf.rotation.y =
            angle;


        leaf.rotation.x =

        group.add(
            leaf
        );

    }


    group.position.set(
        x,
        1.1,
        z
    );


    scene.add(
        group
    );

function createTunnel(
    points,
    radius=.65
){

    const curve =
        new THREE.CatmullRomCurve3(
            points
        );


    const geometry =
        new THREE.TubeGeometry(

            curve,

            48,

            radius,

            16,

            false

        );


    const tunnel =
        new THREE.Mesh(

            geometry,

            tunnelMat

        );


    tunnel.castShadow =
        true;


    tunnel.receiveShadow =
        true;


    scene.add(
        tunnel
    );


    return tunnel;

}



function createShaft(
    x,
    y1,
    y2,
    z,
    radius=.5
){

    const shaft =
        cylinder(

            radius,
            radius,

            Math.abs(
                y2-y1
            ),

            tunnelMat,

            16

        );


    shaft.position.set(

        x,

        (
            y1+y2
        )/2,

        z

    );


    scene.add(
        shaft
    );


    return shaft;

}

========================================================= */

function addSmoke(
    group,
    x,
    y,
    z
){

    for(
        let i=0;
        i<24;
        i++
    ){

        const smokeMaterial =
            new THREE.MeshStandardMaterial({

                color:
                    0xc9c2b9,

                transparent:
                    true,

                opacity:
                    .05+
                    Math.random()*
                    .06,

                roughness:
                    1

            });


        const smoke =
            new THREE.Mesh(

                new THREE.SphereGeometry(

                    .055+
                    Math.random()*
                    .055,

                    8,
                    8

                ),

                smokeMaterial

            );


        smoke.position.set(

            x+
            (
                Math.random()-.5
            )*
            .14,

            y+
            Math.random()*
            .65,

            z+
            (
                Math.random()-.5
            )*
            .14

        );


        smoke.userData = {

            baseX:
                smoke.position.x,

            baseY:
                smoke.position.y,

            baseZ:
                smoke.position.z,

            speed:
                .07+
                Math.random()*
                .07,

            phase:
                Math.random()*
                Math.PI*
                2

        };


        group.add(
            smoke
        );


        smokeParticles.push(
            smoke
        );

    }

}

    ladderLeft
);


const ladderRight =
    ladderLeft.clone();


ladderRight.position.x =
    18.35;


scene.add(
    ladderRight
);


for(
    let i=0;
    i<9;
    i++
){

    const rung =
        box(
            .72,
            .055,
            .07,
            woodMat
        );


    rung.position.set(
        18,
        -7.7+
        i*.85,
        -10.6
    );


    scene.add(
        rung
    );

}


addMarker(
    18,
    1.5,
    -11,
    wellData
);


focusTargets.well = {

    position:
        new THREE.Vector3(
            25,
            7,
            -3
        ),

    target:
        new THREE.Vector3(
            18,
            -3,
            -11
        )

};



/* =========================================================
   35. THÔNG KHÍ
========================================================= */

function createVent(
    x,
    z
){

    const vent =
        cylinder(

            .15,
            .15,
            6.5,

            material(
                0x452f24,
                1
            ),

            10

        );


    vent.position.set(
        x,
        -2.1,
        z
    );


    scene.add(
        vent
    );


    const cap =
        box(

            .4,
            .2,
            .4,

            material(
                0x573a2a,
                1
            )

        );


    cap.position.set(
        x,
        1.25,
        z
    );


    scene.add(
        cap
    );

}


createVent(-10,9);
createVent(8,9);
createVent(-6,-8);



/* =========================================================
   36. CAMERA
========================================================= */

const cameraTween = {

    active:false,

    destination:
        new THREE.Vector3(),

    target:
        new THREE.Vector3()

};



function moveCamera(
    position,
    target
){

    cameraTween.active =
        true;


    cameraTween.destination
        .copy(
            position
        );


    cameraTween.target
        .copy(
            target
        );

}



function goOverview(){

    moveCamera(

        new THREE.Vector3(
            37,
            23,
            39
        ),

        new THREE.Vector3(
            0,
            -5,
            0
        )

    );

}



function focusRoom(
    key
){

    const location =
        focusTargets[key];


    if(
        !location
    ){

        return;

    }


    moveCamera(

        location.position,

        location.target

    );

}



/* =========================================================
   37. POPUP
========================================================= */

function openInfo(
    data
){

    document
        .getElementById(
            "infoIcon"
        )
        .textContent =
        data.icon;


    document
        .getElementById(
            "infoTitle"
        )
        .textContent =
        data.title;


    document
        .getElementById(
            "infoDescription"
        )
        .textContent =
        data.description;


    document
        .getElementById(
            "infoDetails"
        )
        .innerHTML =
        data.details
        .map(
            item =>
            `<li>${item}</li>`
        )
        .join("");


    document
        .getElementById(
            "infoNote"
        )
        .textContent =
        data.note;


    document
        .getElementById(
            "infoPanel"
        )
        .classList
        .add("show");


    document
        .getElementById(
            "overlay"
        )
        .classList
        .add("show");

}



function closeInfo(){

    document
        .getElementById(
            "infoPanel"
        )
        .classList
        .remove("show");


    document
        .getElementById(
            "overlay"
        )
        .classList
        .remove("show");

}



/* =========================================================
   38. RAYCAST
========================================================= */

const raycaster =
    new THREE.Raycaster();


const mouse =
    new THREE.Vector2();


const hoverName =
    document.getElementById(
        "hoverName"
    );



function updateMouse(
    event
){

    const bounds =
        renderer.domElement
        .getBoundingClientRect();


    mouse.x =
        (
            (
                event.clientX-
                bounds.left
            )/
            bounds.width
        )*
        2-
        1;


    mouse.y =
        -
        (
            (
                event.clientY-
                bounds.top
            )/
            bounds.height
        )*
        2+
        1;

}



renderer.domElement
.addEventListener(

    "pointermove",

    event => {

        updateMouse(
            event
        );


        raycaster
            .setFromCamera(
                mouse,
                camera
            );


        const hit =
            raycaster
            .intersectObjects(
                clickableObjects,
                false
            );


        if(
            hit.length>0
            &&
            hit[0]
            .object
            .userData
            .title
        ){

            renderer
                .domElement
                .style
                .cursor =
                "pointer";


            hoverName.style.display =
                "block";


            hoverName.style.left =
                event.clientX+
                12+
                "px";


            hoverName.style.top =
                event.clientY+
                12+
                "px";


            hoverName.textContent =
                hit[0]
                .object
                .userData
                .title;

        }

        else{

            renderer
                .domElement
                .style
                .cursor =
                "grab";


            hoverName.style.display =
                "none";

        }

    }

);



renderer.domElement
.addEventListener(

    "click",

    event => {

        updateMouse(
            event
        );


        raycaster
            .setFromCamera(
                mouse,
                camera
            );


        const hit =
            raycaster
            .intersectObjects(
                clickableObjects,
                false
            );


        if(
            hit.length>0
        ){

            const data =
                hit[0]
                .object
                .userData;


            if(
                data
                &&
                data.title
            ){

                openInfo(
                    data
                );

            }

        }

    }

);



/* =========================================================
   39. RESIZE
========================================================= */

window.addEventListener(

    "resize",

    () => {

        camera.aspect =
            container.clientWidth/
            container.clientHeight;


        camera
            .updateProjectionMatrix();


        renderer
            .setSize(

                container.clientWidth,

                container.clientHeight

            );

    }

);



/* =========================================================
   40. ANIMATION
========================================================= */

const clock =
    new THREE.Clock();



function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    if(
        cameraTween.active
    ){

        camera.position
        .lerp(

            cameraTween.destination,

            .055

        );


        controls.target
        .lerp(

            cameraTween.target,

            .055

        );


        if(
            camera.position
            .distanceTo(
                cameraTween.destination
            )
            <
            .08
        ){

            cameraTween.active =
                false;

        }

    }


    markers
    .forEach(

        (
            marker,
            index
        ) => {

            const scale =
                1+
                Math.sin(

                    time*2+
                    index

                )*
                .1;


            marker.scale
                .setScalar(
                    scale
                );

        }

    );


    smokeParticles
    .forEach(

        smoke => {

            smoke.position.y +=
                smoke
                .userData
                .speed*
                .009;


            smoke.position.x =
                smoke
                .userData
                .baseX
                +
                Math.sin(

                    time*.5+
                    smoke
                    .userData
                    .phase

                )*
                .045;


            smoke.position.z =
                smoke
                .userData
                .baseZ
                +
                Math.cos(

                    time*.4+
                    smoke
                    .userData
                    .phase

                )*
                .03;


            const rise =
                smoke.position.y-
                smoke
                .userData
                .baseY;


            smoke.scale
                .setScalar(

                    1+
                    rise*
                    .14

                );


            smoke.material.opacity -=
                .0003;


            if(

                smoke.position.y >
                smoke
                .userData
                .baseY+
                1.5

                ||

                smoke.material.opacity <
                .015

            ){

                smoke.position.y =
                    smoke
                    .userData
                    .baseY;


                smoke.position.x =
                    smoke
                    .userData
                    .baseX
                    +
                    (
                        Math.random()-.5
                    )*
                    .1;


                smoke.position.z =
                    smoke
                    .userData
                    .baseZ
                    +
                    (
                        Math.random()-.5
                    )*
                    .1;


                smoke.scale
                    .setScalar(
                        1
                    );


                smoke.material.opacity =
                    .045+
                    Math.random()*
                    .055;

            }

        }

    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}



animate();


goOverview();

</script>
